<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんたん家計簿</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --text: #23211c; --muted: #77736a; --line: #e4e1d8;
  --accent: #2f7d5b; --accent-soft: #e2f1e9; --expense: #c2493d; --income: #2f6fb5; --warn: #d08a1c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17171a; --card: #222226; --text: #ecebe6; --muted: #a09d94; --line: #36363b;
    --accent: #5cc193; --accent-soft: #23362d; --expense: #ec7a6e; --income: #74a8e6; --warn: #e7ad4c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.5; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 1.4rem; margin: 8px 0 16px; }
h2 { font-size: 1rem; margin: 0 0 12px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.month strong { font-size: 1.15rem; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.link { border: none; background: none; color: var(--muted); padding: 2px 6px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 10px; }
.stat span { display: block; font-size: .8rem; color: var(--muted); }
.stat b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.income { color: var(--income); } .expense { color: var(--expense); }
form.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
form.entry .full { grid-column: 1 / -1; }
label { font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; width: 100%; min-width: 0; }
.toggle { display: flex; gap: 0; }
.toggle button { flex: 1; border-radius: 0; }
.toggle button:first-child { border-radius: 8px 0 0 8px; }
.toggle button:last-child { border-radius: 0 8px 8px 0; }
.toggle button.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.bar-row { margin-bottom: 10px; }
.bar-head { display: flex; justify-content: space-between; font-size: .9rem; gap: 8px; }
.bar-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar i.warn { background: var(--warn); } .bar i.over { background: var(--expense); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
ul.list li:last-child { border-bottom: none; }
.li-main { flex: 1; min-width: 0; }
.li-main small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.empty { color: var(--muted); font-size: .9rem; }
.goal-edit { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-top: 12px; }
details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.budget-grid { display: grid; grid-template-columns: 1fr 120px; gap: 6px 8px; align-items: center; margin-top: 10px; font-size: .9rem; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tip { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }
@media (max-width: 480px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .summary .stat:last-child { grid-column: 1 / -1; }
  .goal-edit { grid-template-columns: 1fr 1fr; }
  .goal-edit button { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<main>
  <h1>かんたん家計簿</h1>

  <div class="month">
    <button id="prev" aria-label="前の月">‹</button>
    <strong id="monthLabel"></strong>
    <button id="next" aria-label="次の月">›</button>
  </div>

  <section>
    <div class="summary">
      <div class="stat"><span>収入</span><b class="income" id="sumIncome"></b></div>
      <div class="stat"><span>支出</span><b class="expense" id="sumExpense"></b></div>
      <div class="stat"><span>残り（貯金にまわせる額）</span><b id="sumLeft"></b></div>
    </div>
  </section>

  <section>
    <h2>記録する</h2>
    <form class="entry" id="entryForm">
      <div class="toggle full" role="group" aria-label="種類">
        <button type="button" data-kind="expense" class="on">支出</button>
        <button type="button" data-kind="income">収入</button>
      </div>
      <label>日付<input type="date" id="fDate" required></label>
      <label>金額（円）<input type="number" id="fAmount" min="1" step="1" inputmode="numeric" required placeholder="1200"></label>
      <label class="full">カテゴリ<select id="fCategory"></select></label>
      <label class="full">メモ<input type="text" id="fMemo" placeholder="スーパーで買い物 など"></label>
      <button class="primary full" type="submit">追加</button>
    </form>
  </section>

  <section>
    <h2>カテゴリ別の支出と予算</h2>
    <div id="budgetBars"></div>
    <details>
      <summary>月の予算を設定する</summary>
      <div class="budget-grid" id="budgetInputs"></div>
      <p class="tip">0 にすると予算なし。予算の8割を超えると黄色、超えると赤になります。</p>
    </details>
  </section>

  <section>
    <h2>貯金目標</h2>
    <div id="goalView"></div>
    <div class="goal-edit">
      <label>目標の名前<input type="text" id="gName" placeholder="旅行資金"></label>
      <label>目標額（円）<input type="number" id="gTarget" min="0" step="1000" inputmode="numeric"></label>
      <button type="button" id="gSave">保存</button>
    </div>
    <p class="tip">各月の「残り」を足し合わせた額を貯金として数えます（マイナスの月は差し引き）。</p>
  </section>

  <section>
    <h2>この月の記録</h2>
    <ul class="list" id="entryList"></ul>
  </section>

  <section>
    <h2>データ</h2>
    <div class="tools">
      <button type="button" id="exportBtn">バックアップを保存</button>
      <button type="button" id="importBtn">バックアップから復元</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <p class="tip">データはこのブラウザの中だけに保存されます。ブラウザのデータを消すと消えるので、ときどきバックアップを保存してください。</p>
  </section>
</main>

<script>
const KEY = 'kakeibo.v1';
const CATEGORIES = {
  expense: ['食費', '日用品', '住居', '水道光熱', '通信', '交通', '医療', '娯楽', '衣服', '交際', 'その他'],
  income: ['給料', 'ボーナス', '副収入', 'その他'],
};
const yen = n => (n < 0 ? '-' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.entries)) return { budgets: {}, goal: { name: '', target: 0 }, ...s };
  } catch (e) {}
  return { entries: [], budgets: {}, goal: { name: '', target: 0 } };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
let kind = 'expense';
let view = today().slice(0, 7); // YYYY-MM

const $ = id => document.getElementById(id);

function fillCategories() {
  $('fCategory').innerHTML = CATEGORIES[kind].map(c => `<option>${c}</option>`).join('');
}

function shiftMonth(delta) {
  const [y, m] = view.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  view = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  render();
}

function render() {
  const [y, m] = view.split('-');
  $('monthLabel').textContent = `${y}年${Number(m)}月`;

  const month = state.entries.filter(e => e.date.startsWith(view));
  const income = month.filter(e => e.kind === 'income').reduce((a, e) => a + e.amount, 0);
  const expense = month.filter(e => e.kind === 'expense').reduce((a, e) => a + e.amount, 0);
  $('sumIncome').textContent = yen(income);
  $('sumExpense').textContent = yen(expense);
  $('sumLeft').textContent = yen(income - expense);
  $('sumLeft').className = income - expense < 0 ? 'expense' : '';

  // category bars
  const byCat = {};
  month.filter(e => e.kind === 'expense').forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const cats = CATEGORIES.expense.filter(c => byCat[c] || state.budgets[c]);
  const maxSpent = Math.max(1, ...cats.map(c => byCat[c] || 0));
  $('budgetBars').innerHTML = cats.length ? cats.map(c => {
    const spent = byCat[c] || 0, budget = state.budgets[c] || 0;
    const ratio = budget ? spent / budget : spent / maxSpent;
    const cls = budget && ratio > 1 ? 'over' : budget && ratio >= 0.8 ? 'warn' : '';
    const note = budget ? `${yen(spent)} / ${yen(budget)}（あと ${yen(budget - spent)}）` : yen(spent);
    return `<div class="bar-row"><div class="bar-head"><span>${c}</span><small>${note}</small></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100, ratio * 100)}%"></i></div></div>`;
  }).join('') : '<p class="empty">まだ支出がありません。</p>';

  // savings goal
  const saved = state.entries.reduce((a, e) => a + (e.kind === 'income' ? e.amount : -e.amount), 0);
  const g = state.goal;
  if (g.target > 0) {
    const pct = Math.max(0, Math.min(100, saved / g.target * 100));
    $('goalView').innerHTML = `<div class="bar-head"><span>${esc(g.name || '貯金目標')}</span>
      <small>${yen(saved)} / ${yen(g.target)}（${pct.toFixed(0)}%）</small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p class="tip">${saved >= g.target ? '目標達成！おめでとうございます 🎉' : `あと ${yen(g.target - saved)}`}</p>`;
  } else {
    $('goalView').innerHTML = `<p class="empty">目標を設定すると、進み具合が表示されます。これまでの貯金：${yen(saved)}</p>`;
  }

  // entry list
  const sorted = [...month].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('entryList').innerHTML = sorted.length ? sorted.map(e => `<li>
      <div class="li-main">${e.category}<small>${Number(e.date.slice(8))}日${e.memo ? '・' + esc(e.memo) : ''}</small></div>
      <span class="amt ${e.kind}">${e.kind === 'income' ? '+' : '-'}${yen(e.amount)}</span>
      <button class="link" data-del="${e.id}" aria-label="削除">✕</button></li>`).join('')
    : '<li class="empty">この月の記録はまだありません。</li>';
}

function renderBudgetInputs() {
  $('budgetInputs').innerHTML = CATEGORIES.expense.map(c =>
    `<span>${c}</span><input type="number" min="0" step="1000" inputmode="numeric" data-budget="${c}" value="${state.budgets[c] || ''}" placeholder="0">`
  ).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

// events
document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.kind;
  document.querySelectorAll('.toggle button').forEach(x => x.classList.toggle('on', x === b));
  fillCategories();
}));

$('entryForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const amount = Math.round(Number($('fAmount').value));
  if (!(amount > 0)) return;
  const date = $('fDate').value || today();
  state.entries.push({ id: Date.now(), kind, date, amount, category: $('fCategory').value, memo: $('fMemo').value.trim() });
  save();
  $('fAmount').value = ''; $('fMemo').value = '';
  view = date.slice(0, 7);
  render();
  $('fAmount').focus();
});

$('entryList').addEventListener('click', ev => {
  const id = ev.target.dataset.del;
  if (!id || !confirm('この記録を削除しますか？')) return;
  state.entries = state.entries.filter(e => String(e.id) !== id);
  save(); render();
});

$('budgetInputs').addEventListener('change', ev => {
  const c = ev.target.dataset.budget;
  if (!c) return;
  const v = Math.max(0, Math.round(Number(ev.target.value) || 0));
  if (v) state.budgets[c] = v; else delete state.budgets[c];
  save(); render();
});

$('gSave').addEventListener('click', () => {
  state.goal = { name: $('gName').value.trim(), target: Math.max(0, Math.round(Number($('gTarget').value) || 0)) };
  save(); render();
});

$('prev').addEventListener('click', () => shiftMonth(-1));
$('next').addEventListener('click', () => shiftMonth(1));

$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kakeibo-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.entries)) throw new Error();
    if (!confirm(`${data.entries.length}件の記録で今のデータを置き換えますか？`)) return;
    state = { budgets: {}, goal: { name: '', target: 0 }, ...data };
    save(); renderBudgetInputs(); syncGoalInputs(); render();
  } catch (e) { alert('ファイルを読み込めませんでした。'); }
  ev.target.value = '';
});

function syncGoalInputs() { $('gName').value = state.goal.name || ''; $('gTarget').value = state.goal.target || ''; }

$('fDate').value = today();
fillCategories();
renderBudgetInputs();
syncGoalInputs();
render();
</script>
</body>
</html>
